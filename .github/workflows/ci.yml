name: Bank Churn CI

on:
  push:
    branches:
      - main
      - mlops-upgrade

  pull_request:
    branches:
      - main
      - mlops-upgrade


jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. CHECKOUT REPOSITORY + GIT LFS
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true


      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # =====================================================
      # 3. VERIFY PYTHON
      # =====================================================

      - name: Verify Python
        run: |
          python --version
          python -m pip --version


      # =====================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      # =====================================================
      # 5. INSTALL CI / TEST DEPENDENCIES
      # =====================================================

      - name: Install test dependencies
        run: |
          python -m pip install pytest
          python -m pip install httpx2


      # =====================================================
      # 6. VERIFY IMPORTANT PACKAGES
      # =====================================================

      - name: Verify installed packages
        run: |
          python -m pytest --version
          python -c "import joblib; print('joblib:', joblib.__version__)"
          python -c "import sklearn; print('scikit-learn:', sklearn.__version__)"
          python -c "import fastapi; print('fastapi:', fastapi.__version__)"
          python -c "import pandas; print('pandas:', pandas.__version__)"
          python -c "import numpy; print('numpy:', numpy.__version__)"


      # =====================================================
      # 7. VERIFY GIT LFS
      # =====================================================

      - name: Verify Git LFS
        run: |
          git lfs version
          git lfs install
          git lfs pull


      # =====================================================
      # 8. VERIFY GRADIENT BOOSTING MODEL
      # =====================================================

      - name: Verify Gradient Boosting model
        run: |
          python - <<'PY'
          import os
          import joblib

          path = "artifacts/models/gradient_boosting.pkl"

          print("Checking:", path)

          if not os.path.exists(path):
              raise FileNotFoundError(
                  f"Required model not found: {path}"
              )

          size = os.path.getsize(path)

          print(
              f"Model size: "
              f"{size / 1024 / 1024:.2f} MB"
          )

          # Detect Git LFS pointer files
          with open(path, "rb") as f:
              header = f.read(100)

          if header.startswith(
              b"version https://git-lfs.github.com/spec/v1"
          ):
              raise RuntimeError(
                  "Git LFS pointer was checked out instead "
                  "of the actual model file."
              )

          model = joblib.load(path)

          print("Model type:", type(model))
          print(
              "Has predict:",
              hasattr(model, "predict")
          )
          print(
              "Has predict_proba:",
              hasattr(model, "predict_proba")
          )

          if not hasattr(model, "predict"):
              raise RuntimeError(
                  "Gradient Boosting model does not "
                  "provide predict()."
              )

          if not hasattr(model, "predict_proba"):
              raise RuntimeError(
                  "Gradient Boosting model does not "
                  "provide predict_proba()."
              )

          print("Gradient Boosting model verified")
          PY


      # =====================================================
      # 9. RUN TESTS
      # =====================================================

      - name: Run tests
        run: |
          python -m pytest -v
