name: CI

on:
  push:
    branches:
      - main
      - mlops-upgrade

  pull_request:
    branches:
      - main
      - mlops-upgrade

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT REPOSITORY + DOWNLOAD GIT LFS FILES
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # =====================================================
      # SETUP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # VERIFY GIT LFS
      # =====================================================

      - name: Pull Git LFS files
        run: |
          git lfs install
          git lfs pull

      # =====================================================
      # VERIFY MODEL FILE
      # =====================================================

      - name: Verify Gradient Boosting model
        run: |
          python - <<'PY'
          import os
          import joblib

          path = "artifacts/models/gradient_boosting.pkl"

          print("Checking:", path)

          if not os.path.exists(path):
              raise FileNotFoundError(
                  f"Required model not found: {path}"
              )

          size = os.path.getsize(path)

          print(
              f"Model size: "
              f"{size / 1024 / 1024:.2f} MB"
          )

          # Detect Git LFS pointer files
          with open(path, "rb") as f:
              header = f.read(100)

          if header.startswith(
              b"version https://git-lfs.github.com/spec/v1"
          ):
              raise RuntimeError(
                  "Git LFS pointer was checked out instead "
                  "of the actual model file."
              )

          model = joblib.load(path)

          print("Model type:", type(model))
          print(
              "Has predict:",
              hasattr(model, "predict")
          )
          print(
              "Has predict_proba:",
              hasattr(model, "predict_proba")
          )

          if not hasattr(model, "predict"):
              raise RuntimeError(
                  "Gradient Boosting model does not "
                  "provide predict()."
              )

          if not hasattr(model, "predict_proba"):
              raise RuntimeError(
                  "Gradient Boosting model does not "
                  "provide predict_proba()."
              )

          print("✓ Gradient Boosting model verified")
          PY

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =====================================================
      # RUN TESTS
      # =====================================================

      - name: Run tests
        run: |
          python -m pytest -v