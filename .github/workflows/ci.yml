name: CI Pipeline

on:
  push:
    branches:
      - main
      - mlops-upgrade

  pull_request:
    branches:
      - main
      - mlops-upgrade


jobs:

  test:

    runs-on: ubuntu-latest

    # IMPORTANT:
    # These are your GitHub Environment variables/secrets.
    # The environment name must match the environment where
    # you stored SUPABASE_URL and SUPABASE_SERVICE_KEY.
    environment:
      name: Predictive Modeling Bank Churn

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # =====================================================
      # SETUP PYTHON
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install dependencies
        run: |
          pip install -r requirements.txt


      # =====================================================
      # SUPABASE ENVIRONMENT VARIABLES
      # =====================================================

      - name: Configure Supabase environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
        run: |
          echo "Supabase environment variables configured."


      # =====================================================
      # RUN TESTS
      # =====================================================

      - name: Run pytest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY || vars.SUPABASE_SERVICE_KEY }}
        run: |
          python -m pytest -v
