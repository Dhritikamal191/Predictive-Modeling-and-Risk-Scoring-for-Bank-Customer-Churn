# =========================================================
# MODEL VARIABLES
# =========================================================

model = None
model_source = None
model_load_error = None


# =========================================================
# LOAD GRADIENT BOOSTING MODEL
# =========================================================

try:

    print("=" * 70)
    print("BANK CHURN API — LOADING MODEL")
    print("=" * 70)

    # -----------------------------------------------------
    # PRIMARY: LOCAL GRADIENT BOOSTING MODEL
    # -----------------------------------------------------

    if LOCAL_MODEL_PATH.exists():

        model = joblib.load(LOCAL_MODEL_PATH)

        model_source = "Local Gradient Boosting Model"

        print("✓ Gradient Boosting model loaded")
        print(f"Path: {LOCAL_MODEL_PATH}")
        print(f"Type: {type(model)}")
        print(
            "predict_proba available:",
            hasattr(model, "predict_proba"),
        )

    else:

        raise FileNotFoundError(
            f"Gradient Boosting model not found at: "
            f"{LOCAL_MODEL_PATH}"
        )

except Exception as e:

    model = None
    model_source = None
    model_load_error = str(e)

    print("=" * 70)
    print("✗ BANK CHURN API — MODEL LOAD FAILED")
    print("=" * 70)
    print(model_load_error)

    traceback.print_exc()